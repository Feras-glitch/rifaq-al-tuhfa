name: بناء الويب وأندرويد وويندوز

# دفع وسم v* أو تشغيل يدوي من main: اختبارات ← نشر الموقع ← APK وبرنامج ويندوز (مع اختبارات تشغيل فعلية) ← إصدار GitHub.
# لا يُنشر الموقع ولا يُنشأ إصدار إلا بعد نجاح كل الاختبارات، ومن main أو وسم فقط.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'إنشاء إصدار GitHub بالملفات (وسم v + رقم الإصدار)'
        type: boolean
        default: true

# الافتراضي قراءة فقط؛ الكتابة لمهمتي النشر والإصدار وحدهما (npm install في المهام الأخرى لا يرى رمزًا يكتب)
permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  web-tests:
    name: اختبارات الويب والصفحة المضيفة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: بناء الموقع
        run: python3 tools/build_web.py _site
      - name: فحص المنهج ومحرك التقييم
        run: |
          node tools/qx_validate.js "curriculum/منهج_المرحلة1_كامل_معتمد_v1.3.json"
          node tests/test_assess.js
          python3 -I tests/check_questions.py curriculum/نص_القرآن_تنزيل_العثماني.json "curriculum/منهج_المرحلة1_كامل_معتمد_v1.3.json"
          # 9.39.11: بنك الاختبار المحجوز (مطابقة تنزيل، الحكم المحسوب، عدم التكرار مع الدروس، توزيع الأجوبة)
          python3 -I tools/verify_exam_bank_9.39.11.py
          # 9.39.11: الأسئلة الإملائية المختلطة (تُفحص على المنهج بدونها، كما صيغت)
          python3 -I -c "import json; p='curriculum/منهج_المرحلة1_كامل_معتمد_v1.3.json'; c=json.load(open(p,encoding='utf-8')); [s.__setitem__('questions',[q for q in s['questions'] if not q['id'].startswith('mx_')]) for s in c['sections']]; json.dump(c,open('/tmp/cur_pre_mx.json','w',encoding='utf-8'),ensure_ascii=False)"
          python3 -I tools/verify_lesson_items_9.39.11.py curriculum/drafts/lesson_items_9.39.11.json /tmp/cur_pre_mx.json
      - name: تثبيت Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: الاختبارات
        env:
          RIFAQ_SITE: ${{ github.workspace }}/_site
          RIFAQ_TEST_OUT: ${{ runner.temp }}/hosttest
        run: python3 tests/test_host_playwright.py

  web:
    name: الويب (GitHub Pages)
    needs: [web-tests, android-emulator, windows]  # 9.39.3: لا نشر للموقع قبل نجاح كل الاختبارات
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: بناء الموقع
        run: python3 tools/build_web.py _site
      - name: نشر على فرع gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          commit_message: 'نشر الموقع ${{ github.sha }}'

  android:
    name: أندرويد (APK)
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: بناء الموقع داخل غلاف أندرويد
        run: python3 tools/build_web.py native/android/www
      - name: توليد مشروع أندرويد وترقيعه
        working-directory: native/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
      - name: مفتاح التوقيع (من الأسرار)
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/rifaq.keystore"
            echo "RIFAQ_KEYSTORE_PATH=$RUNNER_TEMP/rifaq.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::لا يوجد مفتاح توقيع ثابت: APK للاختبار فقط. تحديثه لاحقًا يتطلب إزالته، وهذا يمسح بيانات الأطفال على الجهاز."
          fi
      - name: بناء APK
        working-directory: native/android/android
        env:
          RIFAQ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RIFAQ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RIFAQ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          V=$(node -p "require('../package.json').version")
          SUFFIX=""; [ "${{ steps.key.outputs.signed }}" = "true" ] || SUFFIX="-TEST-ONLY"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/Rifaq-al-Tuhfa-$V$SUFFIX.apk"
          ls -la "$GITHUB_WORKSPACE/out"
      - name: فحص APK (التوقيع والصلاحيات وفتح الملفات)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls out/*.apk)
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|^sdkVersion|uses-permission|launchable" | tee badging.txt
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          grep -q "android.permission.RECORD_AUDIO" badging.txt
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "text/html"
          # 9.39.10: النسخ الاحتياطي معطّل (بيانات الأطفال لا تغادر الجهاز)
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -E "android:allowBackup\(0x[0-9a-f]+\)=\(type 0x12\)0x0"
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "dataExtractionRules"
          unzip -l "$APK" | grep -E "assets/public/(open.html|host.js|app/template.txt|trusted-teachers.json)"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  android-emulator:
    name: أندرويد — تشغيل على المحاكي
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: apk }
      - name: تفعيل KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash native/android/scripts/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screens
          path: '*.png'
          if-no-files-found: ignore

  windows:
    name: ويندوز (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: بناء الموقع داخل برنامج ويندوز
        run: |
          python tools/build_web.py native/windows/site
          New-Item -ItemType Directory -Force native/windows/build | Out-Null
          Copy-Item web/icons/icon-512.png native/windows/build/icon.png
      - name: بناء المثبّت والنسخة المحمولة
        working-directory: native/windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
          Get-ChildItem dist -Filter *.exe | Format-Table Name, Length
      - name: فحص ذاتي للبرنامج المبني (تشغيل فعلي)
        working-directory: native/windows
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:RIFAQ_SMOKE_OUT = $out
          $p = Start-Process -FilePath 'dist\win-unpacked\RifaqAlTuhfa.exe' -ArgumentList '--rifaq-self-test' -PassThru -Wait
          if (Test-Path $out) { Get-Content $out -Encoding UTF8 } else { Write-Host 'لا يوجد ملف نتائج' }
          if ($p.ExitCode -ne 0) { throw "الفحص الذاتي فشل: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: native/windows/dist/*.exe
          if-no-files-found: error

  release:
    name: إصدار GitHub
    if: (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/')
    needs: [web-tests, web, android, android-emulator, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - id: v
        run: echo "tag=v$(node -p "require('./native/android/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: windows-exe, path: dist }
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: رفاق التحفة ${{ steps.v.outputs.tag }}
          prerelease: ${{ needs.android.outputs.signed != 'true' }}
          files: dist/*
          body: |
            ## رفاق التحفة ${{ steps.v.outputs.tag }}

            | المنصة | الملف |
            |---|---|
            | أندرويد (هاتف وتابلت) | `Rifaq-al-Tuhfa-*.apk` |
            | ويندوز — مثبّت | `Rifaq-al-Tuhfa-Setup-*.exe` |
            | ويندوز — نسخة محمولة بلا تثبيت | `Rifaq-al-Tuhfa-Portable-*.exe` |
            | الويب | https://feras-glitch.github.io/rifaq-al-tuhfa/ |

            ${{ needs.android.outputs.signed != 'true' && '> ⚠️ **APK للاختبار فقط** (اسمه ينتهي بـ TEST-ONLY): موقَّع بمفتاح مؤقت. تحديثه إلى إصدار لاحق يتطلب إزالته، وهذا **يمسح تسجيلات الأطفال وتقدّمهم** على الجهاز. لا توزّعه على الأسر قبل إضافة مفتاح التوقيع الثابت.' || '' }}

            برنامج ويندوز غير موقَّع: عند أول تشغيل قد يظهر تحذير SmartScreen («More info» ثم «Run anyway»).
            الإهداء يظهر «موثّقًا» فقط إن وقّعه معلم مسجَّل في `web/trusted-teachers.json` داخل هذا الإصدار.
            سجل التغييرات: `docs/CHANGELOG_9.39.md`. المنهج لم يُعتمد علميًا بعد؛ الاستخدام الحالي للتجربة داخل الأسرة.
